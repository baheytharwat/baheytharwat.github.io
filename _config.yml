# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Bahey Tharwat"
title_separator          : "-"
name                     : &name "Bahey Tharwat"
description              : &description "Bahey Tharwat's academic portfolio"   # Default site description if a page does not provide one
url                      : https://baheytharwat.github.io # The base hostname & protocol for your site e.g. "https://[your GitHub username].github.io",
                                                           # or if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "baheytharwat/baheytharwat.github.io"

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Bahey Tharwat"
  # pronouns       : # Example: "she/her"
  bio              :
  location         : "Freiburg, Germany"
  employer         : "PhD Student"
  # uri            : # Personal or institutional website URL
  email            : "baheytharwat@gmail.com"

  # Academic websites
  # academia       : # URL
  # arxiv          : # URL
  googlescholar    : "https://scholar.google.com/citations?user=bH37N5cAAAAJ&hl=en"
  # inspire-hep    : # URL
  # impactstory    : # URL
  # orcid          : # URL
  # semantic       : # URL
  # ssrn           : # URL
  # pubmed         : # URL
  # researchgate   : # URL
  # scopus         : # URL
  # zotero         : # URL


  # Repositories and software development
  # bitbucket      : # Username
  # codepen        : # Username
  # dribbble       : # Username
  github           : "baheytharwat"
  # kaggle         : # Username
  # stackoverflow  : # User number or user number and name

  # Social media
  # artstation     : # Username
  # bluesky        : # Username
  # facebook       : # Username
  # flickr         : # Username
  # foursquare     : # Username
  # goodreads      : # Username
  # google_plus    : # Username
  # keybase        : # Username
  # instagram      : # Username
  # lastfm         : # Username
  linkedin         : "baheytharwat"
  # mastodon       : # URL
  # medium         : # URL
  # pinterest      : # Username
  # soundcloud     : # Username
  # steam          : # Username
  # telegram       : # URL
  # tumblr         : # Username
  # twitter        : # Username for X / Twitter
  # vine           : # Username
  # weibo          : # Username
  # wikipedia      : # Username
  # xing           : # Username
  # youtube        : # Username
  # zhihu          : # Username

# Publication Category - The following the list of publication categories and their headings
publication_category:
  # books:
  #   title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
# Comments are not currently used.
# comments:
#   provider             :
# staticman:
#   ...
atom_feed:
  hide                   : false     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO verification is not currently configured.
# google_site_verification :
# bing_site_verification   :
# alexa_site_verification  :
# yandex_site_verification :


# Social-sharing metadata is not currently configured.
# twitter:
#   username             : &twitter
# facebook:
#   username             :
#   app_id               :
#   publisher            :
# og_image               : # Default social preview image
# og_description         : # Default social preview description
social:
  type                   : Person
  name                   : "Bahey Tharwat"
  links:
    - "https://scholar.google.com/citations?user=bH37N5cAAAAJ&hl=en"
    - "https://www.linkedin.com/in/baheytharwat/"
    - "https://github.com/baheytharwat"


# Analytics
analytics:
  provider               : false # Enable later if analytics is needed
  # google:
  #   tracking_id        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  # teaching:
  #   output: true
  #   permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  # portfolio:
  #   output: true
  #   permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching is not currently used.
  # - scope:
  #     path: ""
  #     type: teaching
  #   values:
  #     layout: single
  #     author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _portfolio is not currently used.
  # - scope:
  #     path: ""
  #     type: portfolio
  #   values:
  #     layout: single
  #     author_profile: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Europe/Berlin # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
